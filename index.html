<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>M-Crew</title>
<style>
  :root { --bg:#FFF8E7; --card:#fff; --ink:#3B2A1A; --sub:#7A6652; --brand:#E3001B; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1E1914; --card:#2A231C; --ink:#F3E9DC; --sub:#BFAE9A; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  .card { width:100%; max-width:380px; background:var(--card); border-radius:20px; padding:32px 24px; text-align:center;
          box-shadow:0 6px 24px rgba(0,0,0,.08); }
  .word { font-size:28px; font-weight:800; color:var(--brand); letter-spacing:.02em; }
  h1 { font-size:18px; margin:16px 0 8px; }
  p { font-size:15px; line-height:1.7; color:var(--sub); margin:0; }
</style>
</head>
<body>
  <div class="card">
    <div class="word">M-Crew</div>
    <h1>現在、公開を停止しています</h1>
    <p>シフト募集ボードは利用を休止しています。<br>シフトに関するご連絡は、店舗の管理者へ直接お願いします。</p>
  </div>
</body>
</html>
