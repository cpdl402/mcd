<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>シフト募集ボード</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1f2328; --sub:#6b6f76; --line:#e3e1dc;
          --accent:#1f6f5c; --accent-ink:#fff; --warn:#a33a2c; --full:#9aa0a6; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:16px 16px 48px; }
  h1 { font-size:20px; margin:8px 0 4px; }
  .notice { color:var(--sub); font-size:14px; margin:0 0 16px; white-space:pre-wrap; }
  .bar { position:sticky; top:0; background:var(--bg); padding:8px 0 12px; z-index:2;
         display:flex; gap:8px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  input[type=text], input[type=password] { font-size:16px; padding:10px 12px; border:1px solid var(--line);
         border-radius:10px; background:#fff; width:100%; }
  .bar input { flex:1 1 200px; }
  label.chk { font-size:14px; color:var(--sub); white-space:nowrap; display:flex; gap:6px; align-items:center; }
  button { font-size:15px; padding:10px 14px; border-radius:10px; border:0; cursor:pointer;
           background:var(--accent); color:var(--accent-ink); font-weight:600; }
  button.ghost { background:transparent; color:var(--warn); border:1px solid var(--line); font-weight:500; }
  button:disabled { background:var(--full); cursor:default; }
  .day { margin-top:20px; }
  .day h2 { font-size:15px; color:var(--sub); margin:0 0 8px; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px;
          display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; }
  .time { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
  .what { font-size:14px; color:var(--sub); }
  .note { grid-column:1/-1; font-size:13px; color:var(--sub); }
  .left { font-size:13px; font-weight:600; text-align:right; }
  .left.open { color:var(--accent); } .left.full { color:var(--full); }
  .names { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:13px; padding:3px 9px; border-radius:999px; background:#eef3f1; }
  .tag.me { background:var(--accent); color:#fff; }
  .act { grid-column:1/-1; display:flex; justify-content:flex-end; }
  .msg { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#1f2328; color:#fff;
         padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none;
         max-width:calc(100% - 32px); }
  .msg.show { opacity:1; }
  #list.busy { opacity:.6; pointer-events:none; }
  .empty { color:var(--sub); text-align:center; padding:40px 0; }
  .gate { max-width:360px; margin:15vh auto 0; display:grid; gap:12px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="gate" id="gate">
    <h1>シフト募集ボード</h1>
    <p class="notice">お店で共有された合言葉を入力してください。</p>
    <input type="password" id="pass" autocomplete="current-password" placeholder="合言葉">
    <button id="enter">ひらく</button>
  </div>
  <div id="board" hidden>
    <h1>シフト募集ボード</h1>
    <p class="notice" id="notice"></p>
    <div class="bar">
      <input type="text" id="me" list="roster" placeholder="あなたの名前（シフト表と同じ表記）">
      <datalist id="roster"></datalist>
      <label class="chk"><input type="checkbox" id="onlyOpen"> 空きのみ</label>
    </div>
    <div id="list"></div>
  </div>
</div>
<div class="msg" id="msg"></div>

<script>
  // ▼ GASのウェブアプリURL（/exec で終わる）
  var API_URL = 'https://script.google.com/macros/s/AKfycbznL5E_kKaEBiU8CNkYh4ZBXsIMClbd-t72euVqpzIcv5vbU3x31FIXvSoQiKpKj9Ygng/exec';

  var PASS = '', DATA = null;
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function norm(s) { return String(s || '').replace(/[\s　]+/g, ''); }
  function toast(t) { var m = $('msg'); m.textContent = t; m.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { m.classList.remove('show'); }, 2600); }

  function call(action, payload, ok) {
    var body = Object.assign({ action: action, pass: PASS }, payload || {});
    $('list').classList.add('busy');
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error);
        DATA = res.data; ok && ok(); render();
      })
      .catch(function (e) {
        var t = (e && e.message) || 'エラーが発生しました';
        if (/Failed to fetch|NetworkError|JSON/.test(t)) t = '通信できませんでした。電波の良い所でもう一度お試しください';
        if (t.indexOf('合言葉') >= 0) { store('sb_pass', ''); $('board').hidden = true; $('gate').hidden = false; }
        toast(t);
        render();
      })
      .then(function () { $('list').classList.remove('busy'); });
  }

  function enter() {
    PASS = $('pass').value.trim();
    if (!PASS) return;
    call('load', null, function () {
      store('sb_pass', PASS);
      $('gate').hidden = true; $('board').hidden = false;
    });
  }

  function render() {
    if (!DATA) return;
    $('notice').textContent = DATA.notice;
    var dl = $('roster'); dl.innerHTML = '';
    DATA.roster.forEach(function (n) { var o = document.createElement('option'); o.value = n; dl.appendChild(o); });

    var me = norm($('me').value), only = $('onlyOpen').checked;
    var list = $('list'); list.innerHTML = '';
    var groups = {}, order = [];
    DATA.lines.forEach(function (l) {
      if (only && l.filled >= l.need && l.names.indexOf(me) < 0) return;
      if (!groups[l.date]) { groups[l.date] = { label: l.label, items: [] }; order.push(l.date); }
      groups[l.date].items.push(l);
    });
    if (!order.length) { list.appendChild(el('p', 'empty', '表示できる募集ラインはありません')); return; }

    order.forEach(function (d) {
      var g = groups[d], sec = el('section', 'day');
      sec.appendChild(el('h2', null, g.label));
      g.items.forEach(function (l) {
        var c = el('div', 'card');
        var info = el('div');
        info.appendChild(el('div', 'time', l.start + '〜' + l.end));
        if (l.what) info.appendChild(el('div', 'what', l.what));
        c.appendChild(info);
        var left = l.need - l.filled, full = left <= 0;
        c.appendChild(el('div', 'left ' + (full ? 'full' : 'open'), full ? '満員' : 'あと' + left + '人'));
        if (l.note) c.appendChild(el('div', 'note', l.note));
        if (l.names.length) {
          var ns = el('div', 'names');
          l.names.forEach(function (n) { ns.appendChild(el('span', 'tag' + (n === me ? ' me' : ''), n)); });
          c.appendChild(ns);
        }
        var act = el('div', 'act'), mine = me && l.names.indexOf(me) >= 0;
        var b;
        if (mine) {
          b = el('button', 'ghost', '取り消す');
          b.onclick = function () {
            b.disabled = true;
            call('cancel', { id: l.id, name: me }, function () { toast('取り消しました'); });
          };
        } else {
          b = el('button', null, full ? '満員' : 'このラインに入る');
          b.disabled = full;
          b.onclick = function () {
            var n = norm($('me').value);
            if (!n) { toast('先に名前を入力してください'); $('me').focus(); return; }
            b.disabled = true;
            call('apply', { id: l.id, name: n }, function () { toast('応募しました'); });
          };
        }
        act.appendChild(b); c.appendChild(act);
        sec.appendChild(c);
      });
      list.appendChild(sec);
    });
  }

  $('enter').onclick = enter;
  $('pass').onkeydown = function (e) { if (e.key === 'Enter') enter(); };
  $('me').oninput = function () { store('sb_me', $('me').value); render(); };
  $('onlyOpen').onchange = render;
  $('me').value = store('sb_me') || '';
  var saved = store('sb_pass');
  if (saved) { $('pass').value = saved; enter(); }
  setInterval(function () { if (PASS && !document.hidden) call('load'); }, 60000);
</script>
</body>
</html>
