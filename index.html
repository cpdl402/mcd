<style>
  :root {
    --bg:#fffaf0; --card:#fffdf6; --ink:#2a2410; --sub:#8a7f5a; --line:#f0e4b8;
    --accent:#e3001b; --accent-ink:#ffffff; --warn:#c0392b; --full:#c9b9ab;
    --fc-bg:#ffe1ec; --fc-ink:#9c2a54; --op-bg:#dbe8ff; --op-ink:#27508c;
    --deli-bg:#fff3cf; --deli-ink:#8a6a12; --etc-bg:#eee7d6; --etc-ink:#6b6248;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:16px 16px 100px; }
  .appbar { display:flex; align-items:center; gap:10px; margin:4px 0 2px; }
  .appbar-logo { height:30px; width:auto; display:block; }
  .appbar-text { display:flex; flex-direction:column; line-height:1.15; }
  .appbar-word { font-size:18px; font-weight:800; color:var(--ink); letter-spacing:.2px; }
  .appbar-sub { font-size:12px; color:var(--sub); font-weight:600; }
  .notice { color:var(--sub); font-size:14px; margin:0 0 16px; white-space:pre-wrap; }
  .filter-bar { position:sticky; top:0; background:var(--bg); z-index:2; padding-top:4px; }
  .view-toggle { display:flex; background:#f3ecd2; border-radius:999px; padding:3px; gap:2px; margin-bottom:6px; }
  .view-toggle button { flex:1; background:transparent; color:var(--sub); border:none; padding:7px 10px;
                         border-radius:999px; font-size:13px; font-weight:700; }
  .view-toggle button.on { background:var(--accent); color:var(--accent-ink); }
  .bar { background:var(--bg); padding:8px 0 10px;
         display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type=text], input[type=password] { font-size:16px; padding:10px 12px; border:1px solid var(--line);
         border-radius:10px; background:#fff; width:100%; }
  input[type=time] { font-size:15px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .time-picker { display:inline-flex; align-items:center; gap:3px; font-size:15px; color:var(--ink); }
  .time-picker select { font-size:15px; padding:6px 4px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .bar input[type=text] { flex:1 1 200px; }
  label.chk { font-size:14px; color:var(--sub); white-space:nowrap; display:flex; gap:6px; align-items:center; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; padding-bottom:10px; border-bottom:1px solid var(--line); margin-bottom:4px; }
  .chip { font-size:13px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:#fff;
          color:var(--sub); cursor:pointer; font-weight:600; }
  .chip.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .chips.time { padding-bottom:12px; }
  .chips.time .chip { font-size:12px; padding:5px 10px; }
  button { font-size:15px; padding:10px 14px; border-radius:999px; border:0; cursor:pointer;
           background:linear-gradient(135deg,#e3001b,#b8001a); color:var(--accent-ink); font-weight:700; }
  button.ghost { background:transparent; color:var(--warn); border:1px solid var(--line); font-weight:500; }
  button.sub { background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:600; font-size:13px; padding:7px 10px; }
  button:disabled { background:var(--full); color:#fff; cursor:default; }
  .icon-btn { background:#fff; border:1px solid var(--line); color:var(--ink); padding:9px; border-radius:10px;
              display:flex; align-items:center; justify-content:center; flex:none; position:relative; }
  .filter-badge { position:absolute; top:-4px; right:-4px; background:var(--accent); color:#fff; font-size:10px;
                   font-weight:700; border-radius:999px; min-width:16px; height:16px; line-height:16px;
                   text-align:center; padding:0 3px; }
  .day-jump { display:flex; gap:4px; padding-bottom:10px; }
  .day-jump button { flex:1; min-width:0; background:#fff; color:var(--ink); border:1px solid var(--line);
                      border-radius:8px; padding:5px 2px; font-size:11px; font-weight:700; line-height:1.3; text-align:center; }
  .day-jump button span { display:block; }
  .day-jump button:disabled { background:#fff; color:var(--sub); opacity:.4; cursor:default; }
  .day-jump button.today { border-color:var(--accent); color:var(--accent); }
  .day-jump .dj-sat { color:#1f5fbf; }
  .day-jump .dj-sun { color:#d1242f; }
  .day-jump .dj-rest { width:fit-content; margin:3px auto 0; padding:1px 4px; border-radius:999px; font-size:10px; line-height:1.4;
                       background:#e3001b; color:#fff; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  .day-jump .dj-none { background:transparent; color:var(--sub); }
  .day-jump .dj-done { background:#eceae3; color:#8a8574; }
  .day-jump .dj-mine { background:#e4f6ef; color:#1f6f5c; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; display:flex;
                     align-items:center; justify-content:center; padding:16px; }
  .modal-card { background:var(--card); border-radius:14px; padding:18px; width:100%; max-width:360px;
                box-shadow:0 10px 30px rgba(0,0,0,.25); max-height:85vh; overflow-y:auto; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .modal-title { font-size:16px; font-weight:800; color:var(--ink); }
  .modal-close { background:transparent; color:var(--ink); font-size:20px; line-height:1; padding:2px 8px; border-radius:8px; }
  .modal-msg { font-size:14px; color:var(--ink); margin:0 0 4px; line-height:1.5; }
  .modal-actions { display:flex; gap:8px; margin-top:16px; }
  .modal-actions button { flex:1; }
  .day { margin-top:20px; }
  .day h2 { font-size:15px; color:var(--sub); margin:0 0 8px; font-weight:700; }
  .card { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--etc-ink);
          border-radius:14px; padding:14px; margin-bottom:10px;
          display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; }
  .card.cat-FC { border-left-color:var(--fc-ink); }
  .card.cat-OP { border-left-color:var(--op-ink); }
  .card.cat-デリバリー { border-left-color:var(--deli-ink); }
  .cat-badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; margin-left:8px; vertical-align:middle; }
  .cat-badge.FC { background:var(--fc-bg); color:var(--fc-ink); }
  .cat-badge.OP { background:var(--op-bg); color:var(--op-ink); }
  .cat-badge.デリバリー { background:var(--deli-bg); color:var(--deli-ink); }
  .cat-badge.その他 { background:var(--etc-bg); color:var(--etc-ink); }
  .time { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
  .what { font-size:14px; color:var(--sub); }
  .note { grid-column:1/-1; font-size:13px; color:var(--sub); }
  .partial-note { grid-column:1/-1; font-size:12px; color:var(--op-ink); background:var(--op-bg);
                  border-radius:8px; padding:6px 9px; }
  .left { font-size:13px; font-weight:700; text-align:right; }
  .left.open { color:#1f6f5c; } .left.full { color:var(--full); } .left.past { color:var(--sub); }
  .card.past { opacity:.7; }
  .names { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:13px; padding:3px 9px; border-radius:999px; background:var(--etc-bg); color:var(--etc-ink); }
  .tag.me { background:var(--accent); color:var(--accent-ink); font-weight:700; }
  .mine-note { grid-column:1/-1; font-size:12px; font-weight:700; color:#1f6f5c; }
  .act { grid-column:1/-1; display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
  .apply-form { grid-column:1/-1; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
                background:#fffef9; border:1px dashed var(--line); border-radius:10px; padding:10px; }
  .apply-form .fld { display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--sub); }
  .msg { position:fixed; left:50%; bottom:76px; transform:translateX(-50%); background:#2a2410; color:#fff;
         padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none;
         max-width:calc(100% - 32px); z-index:5; }
  .msg.show { opacity:1; }
  #list.busy { opacity:.6; pointer-events:none; }
  .empty { color:var(--sub); text-align:center; padding:40px 0; }
  /* ---- M Crew ログインゲート ---- */
  .gate-screen {
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:24px; overflow:hidden;
    background:linear-gradient(135deg,#e3001b 0%,#b8001a 55%,#7a0014 100%);
  }
  .gate-screen::before {
    content:''; position:absolute; left:-30%; bottom:-65%;
    width:160%; height:130%; border-radius:46%;
    background:linear-gradient(120deg,#ffd35c,#ffac00);
    opacity:.95; pointer-events:none;
  }
  .gate-card {
    position:relative; z-index:1; width:100%; max-width:360px;
    background:#fffdf9; border-radius:22px; padding:34px 28px 28px;
    box-shadow:0 24px 60px rgba(60,0,10,.35); text-align:center;
  }
  .gate-brand { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; margin-bottom:4px; }
  .gate-logo { height:72px; width:auto; display:block; }
  .gate-word { font-size:22px; font-weight:800; color:#20232b; letter-spacing:.2px; }
  .gate-tagline { margin:4px 0 20px; font-size:13px; color:#9a8f72; font-weight:700; }
  .gate-card .notice { text-align:left; margin:0 0 18px; }
  .gate-field { text-align:left; margin-bottom:18px; }
  .gate-field label { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:#4a4536; margin-bottom:7px; }
  .gate-field label svg { flex:none; }
  .gate-field input { width:100%; }
  .pw-wrap { position:relative; }
  .pw-wrap input { padding-right:42px; }
  .pw-eye { position:absolute; right:4px; top:50%; transform:translateY(-50%);
            background:transparent; padding:7px; border-radius:8px; color:#9a8f72;
            display:flex; align-items:center; justify-content:center; }
  .pw-eye:hover { background:#f3eee0; }
  .gate-btn { width:100%; padding:13px 14px; border-radius:999px; font-size:15px;
              background:linear-gradient(135deg,#e3001b,#b8001a); color:#fff;
              box-shadow:0 10px 20px rgba(200,0,20,.35); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .spinner { display:inline-block; width:14px; height:14px; margin-right:6px; vertical-align:-2px;
             border:2px solid rgba(255,255,255,.45); border-top-color:#fff; border-radius:50%;
             animation:spin .6s linear infinite; }
  .gate-card .forgot { margin-top:16px; }
  .forgot { text-align:center; margin-top:8px; }
  .forgot a { color:var(--sub); font-size:12px; text-decoration:underline; }
  .gate-confidential { margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
                        font-size:11px; color:var(--warn); font-weight:700; line-height:1.6; text-align:center; }
  .gate-error { margin:-6px 0 14px; font-size:13px; color:var(--warn); font-weight:700; }
  .weekbar { position:fixed; left:0; right:0; bottom:0; background:#fffdf6; border-top:1px solid var(--line);
             display:flex; gap:6px; padding:8px 10px; overflow-x:auto; z-index:4;
             box-shadow:0 -2px 8px rgba(0,0,0,.05); }
  .weekbtn { flex:0 0 auto; font-size:13px; padding:8px 14px; border-radius:999px; border:1px solid var(--line);
             background:#fff; color:var(--sub); font-weight:700; white-space:nowrap; }
  .weekbtn.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  /* ---- 入口の切り替え・停止表示（2026-11-17追加） ---- */
  .gate-switch { display:flex; background:#f3ecd2; border-radius:999px; padding:3px; gap:2px; margin:0 0 18px; }
  .gate-switch button { flex:1; background:transparent; color:var(--sub); padding:10px 6px; font-size:14px; }
  .gate-switch button.on { background:var(--accent); color:#fff; }
  .gate-suspended { background:#f4f1e6; border-radius:14px; padding:22px 14px; color:var(--ink); font-weight:800;
                    font-size:15px; line-height:1.6; margin-bottom:8px; }
  .gate-suspended small { display:block; font-weight:500; font-size:12px; color:var(--sub); margin-top:4px; }
  /* ---- マネスケ提出（2026-11-17追加） ---- */
  .ms-user { margin-left:auto; font-size:13px; font-weight:700; color:var(--ink); }
  .ms-months { display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 4px; }
  .ms-months button { background:#fff; color:var(--sub); border:1px solid var(--line); font-size:14px; padding:8px 14px; }
  .ms-months button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .ms-home { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:12px 0 14px; }
  .ms-home-title { font-size:17px; font-weight:800; margin:0 0 8px; }
  .ms-home-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14px; margin:5px 0; }
  .ms-home-row .k { color:var(--sub); font-size:13px; min-width:72px; }
  .ms-badge { font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; background:#eee; color:#777; }
  .ms-badge.ok { background:#e4f6ef; color:#1f6f5c; }
  .ms-badge.ng { background:#fde0e0; color:#c62828; }
  .ms-badge.info { background:#dbe8ff; color:#27508c; }
  .ms-alert { margin:10px 0 0; padding:10px 12px; border-radius:10px; font-size:13px; font-weight:700; line-height:1.5; }
  .ms-alert.ng { background:#fde0e0; color:#c62828; }
  .ms-alert.info { background:#f4f1e6; color:var(--sub); }
  .ms-cal-tools { display:flex; gap:6px; justify-content:flex-end; margin-bottom:8px; }
  .ms-cal-tools button { background:#fff; color:var(--sub); border:1px solid var(--line); font-size:12px; padding:6px 12px; }
  .ms-cal-tools button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .ms-cal { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
  .ms-cal-h { text-align:center; font-size:12px; font-weight:700; color:var(--sub); padding:4px 0; }
  .ms-cal-h.sun { color:#c62828; } .ms-cal-h.sat { color:#27508c; }
  .ms-cal-cell { display:flex; flex-direction:column; align-items:center; gap:2px; min-height:62px; padding:6px 2px;
                 border-radius:10px; border:1px solid #e2e2e2; background:#f4f4f4; color:#999; font-weight:700; font-size:14px; }
  .ms-cal-cell.st-available { background:#dff3e8; border-color:#bfe5cf; color:#1f6f5c; }
  .ms-cal-cell.st-off { background:#fde0e0; border-color:#f5b5b5; color:#c62828; }
  .ms-cal-cell.today { box-shadow:inset 0 0 0 2px var(--accent); }
  .ms-cal-t { font-size:10px; font-weight:600; line-height:1.2; word-break:break-all; text-align:center; }
  .ms-legend { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--sub); margin:10px 0 16px; }
  .ms-legend i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:4px; }
  #msActions button { width:100%; padding:14px; font-size:16px; }
  .ms-edit-nav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px; }
  .ms-nav-btn { background:#f3ecd2; color:var(--ink); width:46px; height:46px; padding:0; font-size:26px; line-height:1; flex:none; }
  .ms-nav-btn:disabled { background:#f4f4f4; color:#ccc; }
  .ms-status-btns { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:12px; }
  .ms-status-btns button { background:#f1f1f1; color:#777; font-size:15px; padding:14px 4px; border-radius:12px; }
  .ms-status-btns button.on[data-st="available"] { background:#2e7d32; color:#fff; }
  .ms-status-btns button.on[data-st="off"] { background:#c62828; color:#fff; }
  .ms-status-btns button.on[data-st=""] { background:#777; color:#fff; }
  .ms-status-btns button:disabled { opacity:.5; }
  .ms-chk { white-space:normal; margin-bottom:10px; }
  .ms-time-row { display:flex; align-items:center; gap:8px; margin:0 0 10px; flex-wrap:wrap; font-size:14px; color:var(--sub); }
  .ms-time-row.dim { opacity:.35; }
  .ms-save-badge { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:45; display:flex; align-items:center; gap:10px;
                   background:#2a2410; color:#fff; padding:9px 16px; border-radius:999px; font-size:13px; font-weight:700;
                   box-shadow:0 6px 16px rgba(0,0,0,.25); white-space:nowrap; }
  .ms-save-badge.ok { background:#1f6f5c; }
  .ms-save-badge.ng { background:#c62828; }
  .ms-save-badge button { background:#fff; color:#c62828; font-size:12px; padding:5px 12px; }
  .ms-fld { display:flex; flex-direction:column; gap:5px; font-size:13px; color:var(--sub); font-weight:600; }
  .ms-save-state { min-height:18px; margin:8px 0 0; font-size:12px; font-weight:700; color:var(--sub); text-align:center; }
  .ms-save-state.ok { color:#1f6f5c; } .ms-save-state.ng { color:#c62828; }
  .ms-cf-counts { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:10px; text-align:center; }
  .ms-cf-counts div { background:#f4f1e6; border-radius:10px; padding:8px 4px; font-size:12px; color:var(--sub); font-weight:700; }
  .ms-cf-counts b { display:block; font-size:20px; color:var(--ink); }
  .ms-cf-list { font-size:13px; border-top:1px solid var(--line); margin-top:8px; }
  .ms-cf-list div { display:flex; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); }
  .ms-cf-list .d { min-width:86px; font-weight:700; }
  /* 日数が多くても「提出する」ボタンが常に見えるよう、確認モーダルのボタン行は下に固定 */
  #msConfirmBackdrop .modal-actions { position:sticky; bottom:-18px; background:var(--card); margin:0 -18px -18px; padding:12px 18px 18px;
                                      border-top:1px solid var(--line); }
  .ms-cf-list .av { color:#1f6f5c; font-weight:700; } .ms-cf-list .off { color:#c62828; font-weight:700; }
  .ms-cf-list .nt { color:var(--sub); font-size:12px; }
</style>
</head>

<script>
  // ▼ GASのウェブアプリURL（/exec で終わる）
  var API_URL = 'https://script.google.com/macros/s/AKfycbznL5E_kKaEBiU8CNkYh4ZBXsIMClbd-t72euVqpzIcv5vbU3x31FIXvSoQiKpKj9Ygng/exec';

  var PASS = '', DATA = null, CAT_SEL = {}, WEEK_KEY = '', openApply = null, VIEW = 'lines';
  var TODAY_STR = '';
  function catSelActive_() { return Object.keys(CAT_SEL).some(function (k) { return CAT_SEL[k]; }); }
  var TIME_BANDS = [
    { key: 'bf', start: '05:00', end: '10:00' },
    { key: 'lunch', start: '10:00', end: '14:00' },
    { key: 'snack', start: '14:00', end: '17:00' },
    { key: 'dinner', start: '17:00', end: '20:00' },
    { key: 'night', start: '20:00', end: '24:00' }
  ];
  var TIME_SEL = {};
  function bandOverlaps_(l, b) { return l.start < b.end && l.end > b.start; }
  function timeSelActive_() { return Object.keys(TIME_SEL).some(function (k) { return TIME_SEL[k]; }); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // ネイティブ<input type="time">はstep属性があっても機種によって15分刻みを無視して全分数を選べてしまうため、
  // 時・分（00/15/30/45限定）の2つのプルダウンで確実に15分刻みにする（2026-10-14）
  function makeTimePicker_(initialHHMM, minHHMM, maxHHMM) {
    var parts = String(initialHHMM || '00:00').split(':');
    var ih = parseInt(parts[0], 10) || 0;
    var im = Math.round((parseInt(parts[1], 10) || 0) / 15) * 15;
    if (im >= 60) { im = 0; ih = (ih + 1) % 24; }
    // min/maxが渡された場合は、時の選択肢をその範囲内に絞る（例: 11:00〜14:00のラインなら11〜14時のみ表示）。
    // 範囲ちょうどの境界値（例: 終了=14:00）は必ず選べる必要があるため、時だけで大まかに絞り、
    // 分まで含めた厳密な範囲チェックはこれまで通りサーバー側（withinRange_）に任せる
    var minH = 0, maxH = 23;
    if (minHHMM) minH = parseInt(String(minHHMM).split(':')[0], 10) || 0;
    if (maxHHMM) {
      maxH = parseInt(String(maxHHMM).split(':')[0], 10);
      if (isNaN(maxH)) maxH = 23;
    }
    var wrap = el('span', 'time-picker');
    var hSel = document.createElement('select');
    for (var h = minH; h <= maxH; h++) {
      var oh = document.createElement('option');
      oh.value = String(h).padStart(2, '0'); oh.textContent = oh.value;
      if (h === ih) oh.selected = true;
      hSel.appendChild(oh);
    }
    var mSel = document.createElement('select');
    [0, 15, 30, 45].forEach(function (m) {
      var om = document.createElement('option');
      om.value = String(m).padStart(2, '0'); om.textContent = om.value;
      if (m === im) om.selected = true;
      mSel.appendChild(om);
    });
    wrap.appendChild(hSel);
    wrap.appendChild(document.createTextNode(':'));
    wrap.appendChild(mSel);
    wrap.getValue = function () { return hSel.value + ':' + mSel.value; };
    return wrap;
  }
  function norm(s) { return String(s || '').replace(/[\s　]+/g, ''); }
  function toast(t) { var m = $('msg'); m.textContent = t; m.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { m.classList.remove('show'); }, 2600); }

  function call(action, payload, ok, always) {
    var body = Object.assign({ action: action, pass: PASS, me: $('me') ? $('me').value : '' }, payload || {});
    $('list').classList.add('busy');
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) { var er = new Error(res.error); er.code = res.code; throw er; }
        DATA = res.data; ok && ok(); render();
      })
      .catch(function (e) {
        // 管理者が募集ラインを停止した場合はログイン画面に戻して「ただいま利用できません」を出す
        if (e && e.code === 'SUSPENDED') {
          FEATURES.lines = false; PASS = '';
          $('board').hidden = true; $('gate').hidden = false; gateShow_('lines');
          return;
        }
        var t = (e && e.message) || 'エラーが発生しました';
        if (/Failed to fetch|NetworkError|JSON/.test(t)) t = '通信できませんでした。電波の良い所でもう一度お試しください';
        if (t.indexOf('パスワード') >= 0) {
          store('sb_pass', ''); $('board').hidden = true; $('gate').hidden = false;
          $('gateError').textContent = t; $('gateError').hidden = false;
        }
        toast(t);
        render();
      })
      .then(function () { $('list').classList.remove('busy'); always && always(); });
  }

  function enter() {
    PASS = $('pass').value.trim();
    if (!PASS) return;
    var btn = $('enter');
    if (btn.disabled) return;
    $('gateError').hidden = true;
    btn.disabled = true;
    btn.innerHTML = '';
    btn.appendChild(el('span', 'spinner'));
    btn.appendChild(document.createTextNode('ログイン中…'));
    call('load', null, function () {
      store('sb_pass', PASS);
      $('gate').hidden = true; $('board').hidden = false;
    }, function () {
      btn.disabled = false;
      btn.textContent = 'ログイン';
    });
  }

  // ---- 週（月曜始まり）の算出 ----
  function mondayOf(dateStr) {
    var d = new Date(dateStr.replace(/\//g, '-') + 'T00:00:00');
    var day = (d.getDay() + 6) % 7; // 0=月
    d.setDate(d.getDate() - day);
    return d;
  }
  function ymd(d) { return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0'); }

  function buildWeeks(lines) {
    var map = {};
    // 前1週間・今週・翌2週間（計4週間）は、募集ラインが無くても常にタブを表示する
    var todayMon = mondayOf(ymd(new Date()));
    for (var i = -1; i <= 2; i++) {
      var mon0 = new Date(todayMon);
      mon0.setDate(mon0.getDate() + i * 7);
      map[ymd(mon0)] = mon0;
    }
    // それ以外の週に募集ラインがあれば、そのタブも追加する
    lines.forEach(function (l) {
      var mon = mondayOf(l.date);
      var key = ymd(mon);
      if (!map[key]) map[key] = mon;
    });
    var keys = Object.keys(map).sort();
    // 月内で実際に何週目の月曜かを日付から直接計算する
    // （月初の週に募集ラインが無いと番号がずれてしまう不具合の修正）
    var weeks = keys.map(function (key) {
      var mon = map[key];
      var m = mon.getMonth() + 1;
      var w = Math.floor((mon.getDate() - 1) / 7) + 1;
      return { key: key, label: m + '月' + w + 'W', start: mon };
    });
    return weeks;
  }

  function renderWeekbar(weeks) {
    var bar = $('weekbar');
    bar.innerHTML = '';
    if (weeks.length <= 1) { bar.hidden = true; return; }
    bar.hidden = false;
    weeks.forEach(function (w) {
      var b = el('span', 'weekbtn' + (w.key === WEEK_KEY ? ' on' : ''), w.label);
      b.onclick = function () { WEEK_KEY = w.key; render(); };
      bar.appendChild(b);

  function render() {
    if (!DATA) return;
    TODAY_STR = ymd(new Date());
    $('notice').textContent = DATA.notice;

    var weeks = buildWeeks(DATA.lines);
    if (!WEEK_KEY || !weeks.some(function (w) { return w.key === WEEK_KEY; })) {
      // 初期値は「今週」。今週タブが無ければ先頭の週にフォールバックする
      var curKey = ymd(mondayOf(TODAY_STR));
      WEEK_KEY = weeks.some(function (w) { return w.key === curKey; }) ? curKey : (weeks.length ? weeks[0].key : '');
    }
    renderWeekbar(weeks);

    var me = norm($('me').value);
    var list = $('list'); list.innerHTML = '';
    var groups = {}, order = [];
    DATA.lines.forEach(function (l) {
      var isMine = !!(l.mine && l.mine.length);
      var isFull = l.filled >= l.need;
      var isPastL = l.date < TODAY_STR;
      if (VIEW === 'mine') {
        if (!isMine) return;
      } else {
        // 自分自身が参加予定で満員になった未来・現在のラインは、募集一覧には出さない
        // （「マイシフト」側で確認する。2026-10-14追加。過去分はこれまで通り履歴として一覧にも残す）
        if (isMine && isFull && !isPastL) return;
        if (catSelActive_() && !CAT_SEL[l.category]) return;
        if (timeSelActive_() && !TIME_BANDS.some(function (b) { return TIME_SEL[b.key] && bandOverlaps_(l, b); })) return;
      }
      if (WEEK_KEY && ymd(mondayOf(l.date)) !== WEEK_KEY) return;
      if (!groups[l.date]) { groups[l.date] = { label: l.label, items: [] }; order.push(l.date); }
      groups[l.date].items.push(l);
    });
    // 管理者側では「同じ日付・時間・種別でも別の募集枠」として個別に管理しているが、
    // スタッフ画面では従来どおり同一条件の枠をまとめて1枚のカードで表示する（2026-10-14、
    // 「使用者の画面ではまとめて表示するロジックは変えないでおきたい」との要望）。
    // 「マイシフト」ビューは個々の応募実績をそのまま見せたいのでまとめない
    if (VIEW !== 'mine') {
      order.forEach(function (d) { groups[d].items = mergeLines_(groups[d].items); });
    }
    renderDayJump(order, WEEK_KEY, groups);
    if (!order.length) {
      var emptyMsg = VIEW === 'mine'
        ? (me ? 'この週に参加予定の募集ラインはありません' : '名前を入力すると、あなたが参加予定の募集ラインが表示されます')
        : '表示できる募集ラインはありません';
      list.appendChild(el('p', 'empty', emptyMsg));
      return;
    }

    order.forEach(function (d) {
      var g = groups[d], sec = el('section', 'day');
      sec.id = 'day_' + d.replace(/\//g, '');
      sec.appendChild(el('h2', null, g.label));
      g.items.forEach(function (l) { sec.appendChild(renderCard(l, me)); });

  // 同じ日付・開始・終了・種別・内容の募集ライン（管理者側では別枠として独立している）を、
  // スタッフ画面の表示だけ1枚のカードにまとめる。応募先IDには空きがあるラインのものを使う
  function mergeLines_(items) {
    var map = {}, keyOrder = [];
    items.forEach(function (l) {
      var key = l.start + '|' + l.end + '|' + l.category + '|' + l.what;
      if (!map[key]) { map[key] = []; keyOrder.push(key); }
      map[key].push(l);
    });
    return keyOrder.map(function (key) {
      var group = map[key];
      if (group.length === 1) return group[0];
      var need = 0, filled = 0, names = [], partial = [], mine = [], openId = null;
      group.forEach(function (l) {
        need += l.need; filled += l.filled;
        names = names.concat(l.names || []);
        partial = partial.concat(l.partial || []);
        mine = mine.concat(l.mine || []);
        if (!openId && l.filled < l.need) openId = l.id;
      });
      var base = group[0];
      return {
        id: openId || base.id, date: base.date, label: base.label,
        start: base.start, end: base.end, what: base.what, category: base.category,
        need: need, filled: filled, names: names, partial: partial, mine: mine
      };
    });
  }

  // 日本の祝日判定（外部取得なし。春分・秋分は1980〜2099年の近似式。振替休日・国民の休日に対応。管理画面と同じ実装）
  function jpBaseHoliday_(y, m, d) {
    var dow = new Date(y, m - 1, d).getDay();
    var nth = Math.floor((d - 1) / 7) + 1;
    var base = y - 1980, leap = Math.floor(base / 4);
    if (m === 1 && (d === 1 || (dow === 1 && nth === 2))) return true;
    if (m === 2 && (d === 11 || d === 23)) return true;
    if (m === 3 && d === Math.floor(20.8431 + 0.242194 * base - leap)) return true;
    if (m === 4 && d === 29) return true;
    if (m === 5 && (d === 3 || d === 4 || d === 5)) return true;
    if (m === 7 && dow === 1 && nth === 3) return true;
    if (m === 8 && d === 11) return true;
    if (m === 9 && ((dow === 1 && nth === 3) || d === Math.floor(23.2488 + 0.242194 * base - leap))) return true;
    if (m === 10 && dow === 1 && nth === 2) return true;
    if (m === 11 && (d === 3 || d === 23)) return true;
    return false;
  }
  function isJpHoliday_(dt) {
    var y = dt.getFullYear(), m = dt.getMonth() + 1, d = dt.getDate();
    if (jpBaseHoliday_(y, m, d)) return true;
    var p = new Date(y, m - 1, d - 1);
    while (jpBaseHoliday_(p.getFullYear(), p.getMonth() + 1, p.getDate())) {
      if (p.getDay() === 0) return true;
      p = new Date(p.getFullYear(), p.getMonth(), p.getDate() - 1);
    }
    var b = new Date(y, m - 1, d - 1), a = new Date(y, m - 1, d + 1);
    return dt.getDay() !== 0 && jpBaseHoliday_(b.getFullYear(), b.getMonth() + 1, b.getDate()) &&
      jpBaseHoliday_(a.getFullYear(), a.getMonth() + 1, a.getDate());
  }

  // 週の日付ジャンプ（曜日／日付／残り人数の3段。2026-11-20に残り人数の段を追加）
  function renderDayJump(order, monKey, groups) {
    var box = $('dayJump'); box.innerHTML = '';
    if (!monKey) return;
    var mon = new Date(monKey.replace(/\//g, '-') + 'T00:00:00');
    var labels = ['月', '火', '水', '木', '金', '土', '日'];
    for (var i = 0; i < 7; i++) {
      var d = new Date(mon); d.setDate(d.getDate() + i);
      var key = ymd(d);
      var has = order.indexOf(key) >= 0;
      var b = document.createElement('button');
      b.type = 'button';
      if (key === TODAY_STR) b.className = 'today';
      var dowCls = (d.getDay() === 0 || isJpHoliday_(d)) ? 'dj-sun' : (d.getDay() === 6 ? 'dj-sat' : '');
      b.appendChild(el('span', dowCls, labels[i]));
      b.appendChild(el('span', null, (d.getMonth() + 1) + '/' + d.getDate()));
      // 3段目: 募集一覧ではフィルター適用後の未充足人数の合計（カードの「あと◯人」の合計と一致）、マイシフトでは参加予定の有無
      var items = (has && groups && groups[key]) ? groups[key].items : [];
      var rest = 0;
      items.forEach(function (l) { rest += Math.max(0, l.need - l.filled); });
      var third;
      if (!has) third = el('span', 'dj-rest dj-none', '─');
      else if (VIEW === 'mine') third = el('span', 'dj-rest dj-mine', '参加');
      else if (rest > 0) third = el('span', 'dj-rest', 'あと' + rest);
      else third = el('span', 'dj-rest dj-done', '充足');
      b.appendChild(third);
      if (has) {
        b.onclick = function (k) {
          return function () {
            var target = document.getElementById('day_' + k.replace(/\//g, ''));
            if (!target) return;
            var barH = document.querySelector('.filter-bar').offsetHeight;
            var y = target.getBoundingClientRect().top + window.pageYOffset - barH - 8;
            window.scrollTo({ top: y, behavior: 'smooth' });
          };
        }(key);
      } else {
        b.disabled = true;
      }
      box.appendChild(b);
    }
  }

      bGo.onclick = function () {

        call('apply', { id: l.id, name: n, start: sv, end: ev }, function () { openApply = null; toast('追加しました'); });

  }

  // ============ マネスケ提出（マネージャー画面、2026-11-17追加。仕様は マネスケ仕様.md） ============
  var MS_ID = '', MS_PIN = '', MSD = null, MS_MONTH = '', MS_ED = null, MS_SAVING = false;
  var MS_WJ = ['日', '月', '火', '水', '木', '金', '土'];
  // opts.quiet: エラーをトーストで出さない（裏で保存するときは保存状態バッジで知らせるため）

  function msPost_(action, payload, ok, fail, opts) {
    opts = opts || {};

    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), keepalive: !!opts.keepalive })
      .then(function (r) { return r.json(); })

        else if (/IDまたはパスワード|ログインの失敗/.test(t) && !$('msApp').hidden) { msLogout_(t); }
        else if (!opts.quiet) toast(t);

  // 表示する月: 前回の月がまだあればそれ、なければ入力できる月、それも無ければ最後の月
  function msPickMonth_() {

    if (ms.some(function (m) { return m.month === MS_MONTH; })) return MS_MONTH;
    var ed = ms.filter(function (m) { return m.window.editable; })[0];

  function msDays_(month) {

  function msDow_(ds) { return new Date(ds.replace(/\//g, '-') + 'T00:00:00').getDay(); }
  function msMd_(ds) { var p = ds.split('/'); return Number(p[1]) + '/' + Number(p[2]); }
  function msDayLabel_(ds) { return msMd_(ds) + '（' + MS_WJ[msDow_(ds)] + '）'; }
  function msMonthLabel_(m) { var p = m.split('/'); return p[0] + '年' + Number(p[1]) + '月'; }
  function msMin_(t) { var p = t.split(':'); return Number(p[0]) * 60 + Number(p[1]); }
  function msHm_(t) { var p = t.split(':'); return Number(p[0]) + (p[1] === '00' ? '' : ':' + p[1]); }
  function msShort_(e) { return e.status === 'off' ? 'OFF' : e.start ? msHm_(e.start) + '-' + msHm_(e.end) : '終日'; }
  function msMap_(mv) { var m = {}; mv.entries.forEach(function (e) { m[e.date] = e; }); return m; }
  function msWeekStart_() { return store('ms_week_start') === '1' ? 1 : 0; }

  function msRender_() {
    var mv = msCur_();
    $('msUser').textContent = MSD.me.name + ' さん';
    // 月の切り替え（2か月以上あるときだけ）
    var mb = $('msMonths');
    mb.innerHTML = '';
    if (MSD.months.length > 1) {
      MSD.months.forEach(function (m) {
        var b = el('button', m.month === MS_MONTH ? 'on' : '', msMonthLabel_(m.month));
        b.type = 'button';
        b.onclick = function () { MS_MONTH = m.month; msRender_(); };
        mb.appendChild(b);
      });
    }
    // ホーム（対象月・提出期限・提出状況・入力済み日数）
    var w = mv.window, sub = mv.submission, filled = mv.entries.length;
    var home = $('msHome');
    home.innerHTML = '';
    var card = el('div', 'ms-home');
    card.appendChild(el('p', 'ms-home-title', msMonthLabel_(mv.month) + '分の勤務希望'));
    var r1 = el('div', 'ms-home-row');
    r1.appendChild(el('span', 'k', '提出期限'));
    r1.appendChild(el('span', null, msDayLabel_(w.close) + 'まで'));
    if (w.extended) r1.appendChild(el('span', 'ms-badge info', msMd_(w.extUntil) + 'まで延長中'));
    else r1.appendChild(el('span', 'ms-badge ' + (w.state === 'open' ? 'ok' : w.state === 'closed' ? 'ng' : ''), { before: '受付前', open: '受付中', closed: '締切済み' }[w.state]));
    card.appendChild(r1);
    var r2 = el('div', 'ms-home-row');
    r2.appendChild(el('span', 'k', '提出状況'));
    if (sub.status === 'submitted') {
      r2.appendChild(el('span', 'ms-badge ok', '提出済み'));
      r2.appendChild(el('span', 'ms-cal-t', '最終提出 ' + sub.submittedAt.slice(5, 16)));
    } else r2.appendChild(el('span', 'ms-badge ng', '未提出'));
    card.appendChild(r2);
    var r3 = el('div', 'ms-home-row');
    r3.appendChild(el('span', 'k', '入力済み'));
    r3.appendChild(el('span', null, filled + ' / ' + mv.days + '日'));
    card.appendChild(r3);
    if (w.editable && sub.status !== 'submitted') card.appendChild(el('p', 'ms-alert ng', '未提出です。' + msMd_(w.extended ? w.extUntil : w.close) + 'までに、日付をタップして入力し「提出」してください。'));
    else if (w.editable) card.appendChild(el('p', 'ms-alert info', '締切までは何度でも修正できます（提出済みのまま更新されます）。'));
    else if (w.state === 'before') card.appendChild(el('p', 'ms-alert info', '受付は' + msDayLabel_(w.open) + 'からです。'));
    else card.appendChild(el('p', 'ms-alert info', '締切を過ぎたため閲覧のみです。修正が必要な場合は管理者に相談してください。'));
    home.appendChild(card);
    // 週の始まり（各自の端末に保存）
    var wc = $('msWeekChips');
    wc.innerHTML = '';
    [[0, '日曜始まり'], [1, '月曜始まり']].forEach(function (x) {
      var b = el('button', msWeekStart_() === x[0] ? 'on' : '', x[1]);
      b.type = 'button';
      b.onclick = function () { store('ms_week_start', String(x[0])); msRender_(); };
      wc.appendChild(b);
    });
    // カレンダー
    var grid = el('div', 'ms-cal'), ws = msWeekStart_(), map = msMap_(mv), days = msDays_(mv.month);
    for (var i = 0; i < 7; i++) {
      var d = (ws + i) % 7;
      grid.appendChild(el('div', 'ms-cal-h' + (d === 0 ? ' sun' : d === 6 ? ' sat' : ''), MS_WJ[d]));
    }
    var lead = (msDow_(days[0]) - ws + 7) % 7;
    for (var j = 0; j < lead; j++) grid.appendChild(el('div'));
    days.forEach(function (ds) {
      var e = map[ds];
      var c = el('button', 'ms-cal-cell ' + (e ? 'st-' + e.status : '') + (ds === MSD.today ? ' today' : ''));
      c.type = 'button';
      c.appendChild(el('span', null, String(Number(ds.slice(8)))));
      c.appendChild(el('span', 'ms-cal-t', e ? msShort_(e) + (e.note ? ' ✎' : '') : ''));
      c.onclick = function () { msOpenEdit_(ds); };
      grid.appendChild(c);
    });
    $('msCal').innerHTML = '';
    $('msCal').appendChild(grid);
    // 提出ボタン
    var act = $('msActions');
    act.innerHTML = '';
    if (w.editable) {
      var sb = el('button', null, sub.status === 'submitted' ? '内容を確認して再提出' : '入力内容を確認して提出');
      sb.type = 'button';
      sb.onclick = msOpenConfirm_;
      act.appendChild(sb);
    }
  }

  // ---- 日別入力モーダル（閉じずに ‹ › で前後の日へ。移動・閉じるときに自動保存） ----
  function msTimePicker_(init) {
    var p = String(init).split(':');
    var wrap = el('span', 'time-picker');
    var hSel = document.createElement('select'), mSel = document.createElement('select');
    for (var h = 0; h <= 24; h++) { var o = el('option', null, String(h)); o.value = String(h).padStart(2, '0'); hSel.appendChild(o); }
    ['00', '15', '30', '45'].forEach(function (m) { var o = el('option', null, m); o.value = m; mSel.appendChild(o); });
    hSel.value = p[0]; mSel.value = p[1];
    wrap.appendChild(hSel); wrap.appendChild(document.createTextNode('時')); wrap.appendChild(mSel); wrap.appendChild(document.createTextNode('分'));
    wrap.getValue = function () { return hSel.value === '24' ? '24:00' : hSel.value + ':' + mSel.value; };
    wrap.setDisabled = function (v) { hSel.disabled = v; mSel.disabled = v; };
    return wrap;
  }
  function msOpenEdit_(ds) {
    MS_ED = { date: ds };
    msFillEdit_();
    $('msEdState').textContent = ''; $('msEdState').className = 'ms-save-state';
    $('msEditBackdrop').hidden = false;
  }
  function msFillEdit_() {
    var mv = msCur_(), e = msMap_(mv)[MS_ED.date] || null;
    MS_ED.readOnly = !mv.window.editable;
    MS_ED.status = e ? e.status : '';
    $('msEdTitle').textContent = msDayLabel_(MS_ED.date);
    $('msEdAllDay').checked = !!(e && e.status === 'available' && !e.start);
    var box = $('msEdTimes');
    box.innerHTML = '';
    MS_ED.sp = msTimePicker_(e && e.start ? e.start : '09:00');
    MS_ED.ep = msTimePicker_(e && e.end ? e.end : '18:00');
    box.appendChild(MS_ED.sp); box.appendChild(document.createTextNode('〜')); box.appendChild(MS_ED.ep);
    $('msEdNote').value = e ? e.note : '';
    msSyncEdit_();
    MS_ED.orig = JSON.stringify(msEdValue_());
  }
  function msSyncEdit_() {
    var ro = MS_ED.readOnly;
    Array.prototype.forEach.call($('msEdStatus').children, function (b) {
      b.classList.toggle('on', b.getAttribute('data-st') === MS_ED.status);
      b.disabled = ro;
    });
    // 時刻は常に表示し、「終日」にチェックしたときだけ薄くして選べなくする
    var allDay = $('msEdAllDay').checked;
    $('msEdTimeBox').hidden = MS_ED.status !== 'available';
    $('msEdTimes').classList.toggle('dim', allDay);
    $('msEdAllDay').disabled = ro;
    MS_ED.sp.setDisabled(ro || allDay); MS_ED.ep.setDisabled(ro || allDay);
    $('msEdNote').disabled = ro || !MS_ED.status;
    var days = msDays_(MS_MONTH);
    $('msEdPrev').disabled = MS_ED.date === days[0];
    $('msEdNext').disabled = MS_ED.date === days[days.length - 1];
  }
  function msEdValue_() {
    var st = MS_ED.status, useTime = st === 'available' && !$('msEdAllDay').checked;
    return { date: MS_ED.date, status: st, start: useTime ? MS_ED.sp.getValue() : '', end: useTime ? MS_ED.ep.getValue() : '', note: st ? $('msEdNote').value.trim() : '' };
  }
  function msEdState_(t, cls) { $('msEdState').textContent = t; $('msEdState').className = 'ms-save-state ' + (cls || ''); }
  // ---- 裏での保存（2026-11-17変更） ----
  // 1日ごとに通信を待つと遅いため、入力を確定した時点で画面にはすぐ反映し（MS_PENDINGに溜める）、
  // 最後の入力から1.5秒たったら溜まった分を msSaveEntries で1回にまとめて送る。
  // 送信中に入力された分は次の送信に回す。失敗したら溜めたまま「再試行」を出す（入力は消えない）。
  var MS_PENDING = {}, MS_INFLIGHT = null, MS_FLUSH_T = null, MS_WAITERS = [], MS_SAVE_ERR = false, MS_OK_T = null;
  function msPendingCount_() {
    var n = MS_INFLIGHT ? MS_INFLIGHT.entries.length : 0;
    Object.keys(MS_PENDING).forEach(function (m) { n += Object.keys(MS_PENDING[m]).length; });
    return n;
  }
  function msApplyLocal_(month, v) {
    var mv = MSD && MSD.months.filter(function (m) { return m.month === month; })[0];
    if (!mv) return;
    mv.entries = mv.entries.filter(function (e) { return e.date !== v.date; });
    if (v.status) mv.entries.push({ date: v.date, status: v.status, start: v.start, end: v.end, note: v.note });
    mv.entries.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  }
  function msSaveBadge_(justSaved) {
    var b = $('msSaveBadge'), n = msPendingCount_();
    clearTimeout(MS_OK_T);
    $('msSaveRetry').hidden = !MS_SAVE_ERR;
    if (MS_SAVE_ERR) { b.className = 'ms-save-badge ng'; $('msSaveText').textContent = '保存できていない入力があります'; b.hidden = false; }
    else if (n) { b.className = 'ms-save-badge'; $('msSaveText').textContent = '保存中…'; b.hidden = false; }
    else if (justSaved) {
      b.className = 'ms-save-badge ok'; $('msSaveText').textContent = '✓ 保存しました'; b.hidden = false;
      MS_OK_T = setTimeout(function () { b.hidden = true; }, 1500);
    } else b.hidden = true;
  }
  function msQueue_(month, v) {
    (MS_PENDING[month] = MS_PENDING[month] || {})[v.date] = v;
    msApplyLocal_(month, v);
    msSaveBadge_();
    clearTimeout(MS_FLUSH_T);
    MS_FLUSH_T = setTimeout(function () { msFlush_(); }, 1500);
  }
  function msResolveWaiters_(ok) { var w = MS_WAITERS; MS_WAITERS = []; w.forEach(function (f) { f(ok); }); }
  function msFlush_(keepalive) {
    clearTimeout(MS_FLUSH_T); MS_FLUSH_T = null;
    if (MS_INFLIGHT) return; // 送信中の分が終わったら続きを送る
    var month = Object.keys(MS_PENDING).filter(function (m) { return Object.keys(MS_PENDING[m]).length; })[0];
    if (!month) { msResolveWaiters_(true); return; }
    var batch = MS_PENDING[month];
    delete MS_PENDING[month];
    MS_INFLIGHT = { month: month, entries: Object.keys(batch).map(function (d) { return batch[d]; }) };
    MS_SAVE_ERR = false;
    msSaveBadge_();
    msPost_('msSaveEntries', { month: month, entries: MS_INFLIGHT.entries }, function (mv) {
      MS_INFLIGHT = null;
      if (MSD) {
        // サーバーの最新値に置き換えたうえで、送信中に入力された分を上に重ね直す
        msReplace_(mv);
        var p = MS_PENDING[month] || {};
        Object.keys(p).forEach(function (d) { msApplyLocal_(month, p[d]); });
        msRender_();
      }
      if (msPendingCount_()) msFlush_(); else { msSaveBadge_(true); msResolveWaiters_(true); }
    }, function () {
      MS_INFLIGHT = null;
      if (!MSD) return; // ログアウト済み
      var p = MS_PENDING[month] = MS_PENDING[month] || {};
      Object.keys(batch).forEach(function (d) { if (!p[d]) p[d] = batch[d]; }); // その間に入力し直した日は新しい方を優先
      MS_SAVE_ERR = true;
      msSaveBadge_();
      msResolveWaiters_(false);
    }, { quiet: true, keepalive: keepalive });
  }
  // 未送信の分を送り切ってから cb(true)。送れなければ cb(false)
  function msWhenSaved_(cb) {
    if (!msPendingCount_()) { cb(true); return; }
    MS_WAITERS.push(cb);
    msFlush_();
  }
  $('msSaveRetry').onclick = function () { MS_SAVE_ERR = false; msFlush_(); };
  // アプリを裏に回したときは待たずにすぐ送る。未送信のまま閉じようとしたら警告する
  document.addEventListener('visibilitychange', function () { if (document.hidden && msPendingCount_()) msFlush_(true); });
  window.addEventListener('beforeunload', function (e) { if (msPendingCount_()) { e.preventDefault(); e.returnValue = ''; } });

  // 入力を確定する（画面にすぐ反映し、保存は裏で行う）。時刻の誤りがあればfalse
  function msCommitEdit_() {
    if (MS_ED.readOnly) return true;
    var v = msEdValue_();
    if (JSON.stringify(v) === MS_ED.orig) return true;
    if (v.start && msMin_(v.start) >= msMin_(v.end)) { msEdState_('終了は開始より後の時刻にしてください', 'ng'); return false; }
    msQueue_(MS_MONTH, v);
    MS_ED.orig = JSON.stringify(v);
    msRender_();
    return true;
  }
  function msMoveEdit_(k) {
    if (!msCommitEdit_()) return;
    var days = msDays_(MS_MONTH), i = days.indexOf(MS_ED.date) + k;
    if (i < 0 || i >= days.length) return;
    MS_ED.date = days[i];
    msEdState_('');
    msFillEdit_();
  }
  Array.prototype.forEach.call($('msEdStatus').children, function (b) {
    b.onclick = function () { MS_ED.status = b.getAttribute('data-st'); msSyncEdit_(); };
  });
  $('msEdAllDay').onchange = msSyncEdit_;
  $('msEdPrev').onclick = function () { msMoveEdit_(-1); };
  $('msEdNext').onclick = function () { msMoveEdit_(1); };
  $('msEdClose').onclick = function () { if (msCommitEdit_()) $('msEditBackdrop').hidden = true; };
  $('msEditBackdrop').onclick = function (e) { if (e.target === $('msEditBackdrop')) $('msEdClose').onclick(); };

  // ---- 提出確認 ----
  function msOpenConfirm_() {
    var mv = msCur_(), map = msMap_(mv), days = msDays_(mv.month);
    var nAv = mv.entries.filter(function (e) { return e.status === 'available'; }).length;
    var nOff = mv.entries.filter(function (e) { return e.status === 'off'; }).length;
    var nNone = mv.days - nAv - nOff;
    var body = $('msCfBody');
    body.innerHTML = '';
    var cnt = el('div', 'ms-cf-counts');
    [['勤務可能', nAv], ['OFF', nOff], ['未入力', nNone]].forEach(function (x) {
      var d = el('div'); d.appendChild(el('b', null, String(x[1]))); d.appendChild(document.createTextNode(x[0] + '（日）')); cnt.appendChild(d);
    });
    body.appendChild(cnt);
    if (nNone) body.appendChild(el('p', 'ms-alert ng', '未入力の日が' + nNone + '日あります。このまま提出することもできます。'));
    if (mv.submission.status === 'submitted') body.appendChild(el('p', 'ms-alert info', '提出済みです（最終提出 ' + mv.submission.submittedAt.slice(5, 16) + '）。入力内容はすでに保存されています。'));
    var list = el('div', 'ms-cf-list');
    days.forEach(function (ds) {
      var e = map[ds], row = el('div');
      row.appendChild(el('span', 'd', msDayLabel_(ds)));
      if (!e) row.appendChild(el('span', 'nt', '未入力'));
      else {
        row.appendChild(el('span', e.status === 'off' ? 'off' : 'av', e.status === 'off' ? 'OFF' : '勤務可能 ' + (e.start ? e.start + '〜' + e.end : '（終日）')));
        if (e.note) row.appendChild(el('span', 'nt', e.note));
      }
      list.appendChild(row);
    });
    body.appendChild(list);
    $('msCfSubmit').textContent = mv.submission.status === 'submitted' ? '再提出する' : '提出する';
    $('msCfSubmit').disabled = false;
    $('msConfirmBackdrop').hidden = false;
  }
  function msCloseConfirm_() { $('msConfirmBackdrop').hidden = true; }
  $('msCfClose').onclick = msCloseConfirm_;
  $('msCfBack').onclick = msCloseConfirm_;
  $('msCfSubmit').onclick = function () {
    var btn = $('msCfSubmit'), label = btn.textContent;
    btn.disabled = true;
    btn.textContent = '送信中…';
    var restore = function () { btn.disabled = false; btn.textContent = label; };
    // 裏で保存待ちの入力を送り切ってから提出する
    msWhenSaved_(function (ok) {
      if (!ok) { restore(); toast('保存できていない入力があります。電波の良い所で再試行してください'); return; }
      msPost_('msSubmit', { month: MS_MONTH }, function (mv) {
        msReplace_(mv); msRender_(); msCloseConfirm_(); restore();
        toast('提出しました');
      }, restore);
    });
  };

  $('msEnter').onclick = msEnter_;
  $('msPin').onkeydown = function (e) { if (e.key === 'Enter') msEnter_(); };
  $('msLogout').onclick = function () {
    msWhenSaved_(function (ok) {
      if (ok || confirm('保存できていない入力があります。ログアウトすると失われますが、よろしいですか？')) msLogout_();
    });
  };
  $('msId').value = store('ms_id') || '';
  (function () { // 募集ボードと同じロゴをマネスケ画面の見出しにも使う
    var lg = document.querySelector('#board .appbar-logo');
    if (lg) $('msAppbar').insertBefore(lg.cloneNode(true), $('msAppbar').firstChild);
  })();

  $('me').value = store('sb_me') || '';
  var saved = store('sb_pass');
  if (saved) { $('pass').value = saved; }
  setInterval(function () { if (PASS && !document.hidden) call('load'); }, 60000);
</script>
</body>
</html>
