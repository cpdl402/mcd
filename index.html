<style>
  :root {
    --bg:#fffaf0; --card:#fffdf6; --ink:#2a2410; --sub:#8a7f5a; --line:#f0e4b8;
    --accent:#e3001b; --accent-ink:#ffffff; --warn:#c0392b; --full:#c9b9ab;
    --fc-bg:#ffe1ec; --fc-ink:#9c2a54; --op-bg:#dbe8ff; --op-ink:#27508c;
    --deli-bg:#fff3cf; --deli-ink:#8a6a12; --etc-bg:#eee7d6; --etc-ink:#6b6248;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:16px 16px 100px; }
  .appbar { display:flex; align-items:center; gap:10px; margin:4px 0 2px; }
  .appbar-logo { height:30px; width:auto; display:block; }
  .appbar-text { display:flex; flex-direction:column; line-height:1.15; }
  .appbar-word { font-size:18px; font-weight:800; color:var(--ink); letter-spacing:.2px; }
  .appbar-sub { font-size:12px; color:var(--sub); font-weight:600; }
  .notice { color:var(--sub); font-size:14px; margin:0 0 16px; white-space:pre-wrap; }
  .filter-bar { position:sticky; top:0; background:var(--bg); z-index:2; padding-top:4px; }
  .bar { background:var(--bg); padding:8px 0 10px;
         display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type=text], input[type=password] { font-size:16px; padding:10px 12px; border:1px solid var(--line);
         border-radius:10px; background:#fff; width:100%; }
  input[type=time] { font-size:15px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .bar input[type=text] { flex:1 1 200px; }
  label.chk { font-size:14px; color:var(--sub); white-space:nowrap; display:flex; gap:6px; align-items:center; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; padding-bottom:10px; border-bottom:1px solid var(--line); margin-bottom:4px; }
  .chip { font-size:13px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:#fff;
          color:var(--sub); cursor:pointer; font-weight:600; }
  .chip.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .chips.time { padding-bottom:12px; }
  .chips.time .chip { font-size:12px; padding:5px 10px; }
  button { font-size:15px; padding:10px 14px; border-radius:999px; border:0; cursor:pointer;
           background:linear-gradient(135deg,#e3001b,#b8001a); color:var(--accent-ink); font-weight:700; }
  button.ghost { background:transparent; color:var(--warn); border:1px solid var(--line); font-weight:500; }
  button.sub { background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:600; font-size:13px; padding:7px 10px; }
  button:disabled { background:var(--full); color:#fff; cursor:default; }
  .day { margin-top:20px; }
  .day h2 { font-size:15px; color:var(--sub); margin:0 0 8px; font-weight:700; }
  .card { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--etc-ink);
          border-radius:14px; padding:14px; margin-bottom:10px;
          display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; }
  .card.cat-FC { border-left-color:var(--fc-ink); }
  .card.cat-OP { border-left-color:var(--op-ink); }
  .card.cat-デリバリー { border-left-color:var(--deli-ink); }
  .cat-badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; margin-left:8px; vertical-align:middle; }
  .cat-badge.FC { background:var(--fc-bg); color:var(--fc-ink); }
  .cat-badge.OP { background:var(--op-bg); color:var(--op-ink); }
  .cat-badge.デリバリー { background:var(--deli-bg); color:var(--deli-ink); }
  .cat-badge.その他 { background:var(--etc-bg); color:var(--etc-ink); }
  .time { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
  .what { font-size:14px; color:var(--sub); }
  .note { grid-column:1/-1; font-size:13px; color:var(--sub); }
  .partial-note { grid-column:1/-1; font-size:12px; color:var(--op-ink); background:var(--op-bg);
                  border-radius:8px; padding:6px 9px; }
  .left { font-size:13px; font-weight:700; text-align:right; }
  .left.open { color:#1f6f5c; } .left.full { color:var(--full); } .left.past { color:var(--sub); }
  .card.past { opacity:.7; }
  .names { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:13px; padding:3px 9px; border-radius:999px; background:var(--etc-bg); color:var(--etc-ink); }
  .tag.me { background:var(--accent); color:var(--accent-ink); font-weight:700; }
  .mine-note { grid-column:1/-1; font-size:12px; font-weight:700; color:#1f6f5c; }
  .act { grid-column:1/-1; display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
  .apply-form { grid-column:1/-1; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
                background:#fffef9; border:1px dashed var(--line); border-radius:10px; padding:10px; }
  .apply-form .fld { display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--sub); }
  .msg { position:fixed; left:50%; bottom:76px; transform:translateX(-50%); background:#2a2410; color:#fff;
         padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none;
         max-width:calc(100% - 32px); z-index:5; }
  .msg.show { opacity:1; }
  #list.busy { opacity:.6; pointer-events:none; }
  .empty { color:var(--sub); text-align:center; padding:40px 0; }
  /* ---- M Crew ログインゲート ---- */
  .gate-screen {
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:24px; overflow:hidden;
    background:linear-gradient(135deg,#e3001b 0%,#b8001a 55%,#7a0014 100%);
  }
  .gate-screen::before {
    content:''; position:absolute; left:-30%; bottom:-65%;
    width:160%; height:130%; border-radius:46%;
    background:linear-gradient(120deg,#ffd35c,#ffac00);
    opacity:.95; pointer-events:none;
  }
  .gate-card {
    position:relative; z-index:1; width:100%; max-width:360px;
    background:#fffdf9; border-radius:22px; padding:34px 28px 28px;
    box-shadow:0 24px 60px rgba(60,0,10,.35); text-align:center;
  }
  .gate-brand { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:2px; }
  .gate-logo { height:42px; width:auto; display:block; }
  .gate-word { font-size:26px; font-weight:800; color:#20232b; letter-spacing:.2px; }
  .gate-tagline { margin:4px 0 20px; font-size:13px; color:#9a8f72; font-weight:700; }
  .gate-card .notice { text-align:left; margin:0 0 18px; }
  .gate-field { text-align:left; margin-bottom:18px; }
  .gate-field label { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:#4a4536; margin-bottom:7px; }
  .gate-field label svg { flex:none; }
  .gate-field input { width:100%; }
  .pw-wrap { position:relative; }
  .pw-wrap input { padding-right:42px; }
  .pw-eye { position:absolute; right:4px; top:50%; transform:translateY(-50%);
            background:transparent; padding:7px; border-radius:8px; color:#9a8f72;
            display:flex; align-items:center; justify-content:center; }
  .pw-eye:hover { background:#f3eee0; }
  .gate-btn { width:100%; padding:13px 14px; border-radius:999px; font-size:15px;
              background:linear-gradient(135deg,#e3001b,#b8001a); color:#fff;
              box-shadow:0 10px 20px rgba(200,0,20,.35); }
  .gate-card .forgot { margin-top:16px; }
  .forgot { text-align:center; margin-top:8px; }
  .forgot a { color:var(--sub); font-size:12px; text-decoration:underline; }
  .weekbar { position:fixed; left:0; right:0; bottom:0; background:#fffdf6; border-top:1px solid var(--line);
             display:flex; gap:6px; padding:8px 10px; overflow-x:auto; z-index:4;
             box-shadow:0 -2px 8px rgba(0,0,0,.05); }
  .weekbtn { flex:0 0 auto; font-size:13px; padding:8px 14px; border-radius:999px; border:1px solid var(--line);
             background:#fff; color:var(--sub); font-weight:700; white-space:nowrap; }
  .weekbtn.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="gate-screen" id="gate">

    </div>
    <p class="notice" id="notice"></p>
    <div class="filter-bar">
      <div class="bar">
        <input type="text" id="me" placeholder="あなたの名前（シフト表と同じ表記）">
        <button class="sub" id="refreshBtn">更新</button>

      <div class="chips" id="chips">
        <span class="chip on" data-cat="">全部</span>
        <span class="chip" data-cat="FC">FC</span>

      </div>

        <span class="chip" data-band="bf">BF</span>
        <span class="chip" data-band="lunch">lunch</span>
        <span class="chip" data-band="snack">snack</span>

<div class="msg" id="msg"></div>

<script>
  // ▼ GASのウェブアプリURL（/exec で終わる）
  var API_URL = 'https://script.google.com/macros/s/AKfycbznL5E_kKaEBiU8CNkYh4ZBXsIMClbd-t72euVqpzIcv5vbU3x31FIXvSoQiKpKj9Ygng/exec';

  var PASS = '', DATA = null, CAT_SEL = {}, WEEK_KEY = '', openApply = null;
  var TODAY_STR = '';
  function catSelActive_() { return Object.keys(CAT_SEL).some(function (k) { return CAT_SEL[k]; }); }
  var TIME_BANDS = [
    { key: 'bf', start: '05:00', end: '10:00' },
    { key: 'lunch', start: '10:00', end: '14:00' },
    { key: 'snack', start: '14:00', end: '17:00' },
    { key: 'dinner', start: '17:00', end: '20:00' },
    { key: 'night', start: '20:00', end: '24:00' }
  ];
  var TIME_SEL = {};
  function bandOverlaps_(l, b) { return l.start < b.end && l.end > b.start; }
  function timeSelActive_() { return Object.keys(TIME_SEL).some(function (k) { return TIME_SEL[k]; }); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function norm(s) { return String(s || '').replace(/[\s　]+/g, ''); }
  function toast(t) { var m = $('msg'); m.textContent = t; m.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { m.classList.remove('show'); }, 2600); }

  function call(action, payload, ok) {
    var body = Object.assign({ action: action, pass: PASS, me: $('me') ? $('me').value : '' }, payload || {});
    $('list').classList.add('busy');
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error);
        DATA = res.data; ok && ok(); render();
      })
      .catch(function (e) {
        var t = (e && e.message) || 'エラーが発生しました';
        if (/Failed to fetch|NetworkError|JSON/.test(t)) t = '通信できませんでした。電波の良い所でもう一度お試しください';
        if (t.indexOf('パスワード') >= 0) { store('sb_pass', ''); $('board').hidden = true; $('gate').hidden = false; }
        toast(t);
        render();
      })
      .then(function () { $('list').classList.remove('busy'); });
  }

  function enter() {
    PASS = $('pass').value.trim();
    if (!PASS) return;
    call('load', null, function () {
      store('sb_pass', PASS);
      $('gate').hidden = true; $('board').hidden = false;
    });
  }

  // ---- 週（月曜始まり）の算出 ----
  function mondayOf(dateStr) {
    var d = new Date(dateStr.replace(/\//g, '-') + 'T00:00:00');
    var day = (d.getDay() + 6) % 7; // 0=月
    d.setDate(d.getDate() - day);
    return d;
  }
  function ymd(d) { return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0'); }

  function buildWeeks(lines) {
    var map = {};
    // 前1週間・今週・翌2週間（計4週間）は、募集ラインが無くても常にタブを表示する
    var todayMon = mondayOf(ymd(new Date()));
    for (var i = -1; i <= 2; i++) {
      var mon0 = new Date(todayMon);
      mon0.setDate(mon0.getDate() + i * 7);
      map[ymd(mon0)] = mon0;
    }
    // それ以外の週に募集ラインがあれば、そのタブも追加する
    lines.forEach(function (l) {
      var mon = mondayOf(l.date);
      var key = ymd(mon);
      if (!map[key]) map[key] = mon;
    });
    var keys = Object.keys(map).sort();
    // 月内で実際に何週目の月曜かを日付から直接計算する
    // （月初の週に募集ラインが無いと番号がずれてしまう不具合の修正）
    var weeks = keys.map(function (key) {
      var mon = map[key];
      var m = mon.getMonth() + 1;
      var w = Math.floor((mon.getDate() - 1) / 7) + 1;
      return { key: key, label: m + '月' + w + 'W', start: mon };
    });
    return weeks;
  }

  function renderWeekbar(weeks) {
    var bar = $('weekbar');
    bar.innerHTML = '';
    if (weeks.length <= 1) { bar.hidden = true; return; }
    bar.hidden = false;
    weeks.forEach(function (w) {
      var b = el('span', 'weekbtn' + (w.key === WEEK_KEY ? ' on' : ''), w.label);
      b.onclick = function () { WEEK_KEY = w.key; render(); };
      bar.appendChild(b);
    });
  }

  function render() {
    if (!DATA) return;
    TODAY_STR = ymd(new Date());
    $('notice').textContent = DATA.notice;

    var weeks = buildWeeks(DATA.lines);
    if (!WEEK_KEY || !weeks.some(function (w) { return w.key === WEEK_KEY; })) {
      // 初期値は「今週」。今週タブが無ければ先頭の週にフォールバックする
      var curKey = ymd(mondayOf(TODAY_STR));
      WEEK_KEY = weeks.some(function (w) { return w.key === curKey; }) ? curKey : (weeks.length ? weeks[0].key : '');
    }
    renderWeekbar(weeks);

    var me = norm($('me').value);
    var list = $('list'); list.innerHTML = '';
    var groups = {}, order = [];
    DATA.lines.forEach(function (l) {
      if (catSelActive_() && !CAT_SEL[l.category]) return;
      if (timeSelActive_() && !TIME_BANDS.some(function (b) { return TIME_SEL[b.key] && bandOverlaps_(l, b); })) return;
      if (WEEK_KEY && ymd(mondayOf(l.date)) !== WEEK_KEY) return;
      if (!groups[l.date]) { groups[l.date] = { label: l.label, items: [] }; order.push(l.date); }
      groups[l.date].items.push(l);
    });
    if (!order.length) { list.appendChild(el('p', 'empty', '表示できる募集ラインはありません')); return; }

    order.forEach(function (d) {
      var g = groups[d], sec = el('section', 'day');
      sec.appendChild(el('h2', null, g.label));
      g.items.forEach(function (l) { sec.appendChild(renderCard(l, me)); });
      list.appendChild(sec);
    });
  }

  function renderCard(l, me) {
    var cat = l.category || 'その他';
    var isPast = l.date < TODAY_STR;
    var c = el('div', 'card cat-' + cat + (isPast ? ' past' : ''));
    var info = el('div');
    var timeLine = el('div', 'time', l.start + '〜' + l.end);
    var badge = el('span', 'cat-badge ' + cat, cat);
    timeLine.appendChild(badge);
    info.appendChild(timeLine);
    if (l.what && l.what.indexOf('搬入') >= 0) info.appendChild(el('div', 'what', l.what));
    c.appendChild(info);
    var left = l.need - l.filled, full = left <= 0;
    var leftText = isPast ? (full ? '終了（充足）' : '終了（未充足）') : (full ? '満員' : 'あと' + left + '人');
    c.appendChild(el('div', 'left ' + (isPast ? 'past' : (full ? 'full' : 'open')), leftText));
    if (l.note) c.appendChild(el('div', 'note', l.note));
    if (l.partial && l.partial.length) {
      var p = el('div', 'partial-note', '一部対応可能な人あり: ' + l.partial.map(function (x) { return x.start + '〜' + x.end; }).join('、'));
      c.appendChild(p);
    }
    if (l.names && l.names.length) {
      var ns = el('div', 'names');
      l.names.forEach(function (n) { ns.appendChild(el('span', 'tag' + (n === me ? ' me' : ''), n)); });
      c.appendChild(ns);
    }

    var mine = l.mine && l.mine[0];
    if (mine) {
      var noteText = isPast
        ? (mine.full ? 'あなたは参加しました'
          : 'あなたは一部対応（' + mine.start + '〜' + mine.end + '）で参加しました')
        : (mine.full ? 'あなたは参加予定です'
          : mine.approved ? ('あなたは一部対応（承認済み）で参加予定です（' + mine.start + '〜' + mine.end + '）')
          : ('あなたは一部対応で参加予定です（' + mine.start + '〜' + mine.end + '）'));
      c.appendChild(el('div', 'mine-note', noteText));
      return c;
    }
    if (isPast) return c; // 過去の枠は応募ボタンを出さない（読み取り専用）

    var act = el('div', 'act');
    var bFull = el('button', null, full ? '満員' : 'フルで入る');
    bFull.disabled = full;
    bFull.onclick = function () {
      var n = norm($('me').value);
      if (!n) { toast('先に名前を入力してください'); $('me').focus(); return; }
      bFull.disabled = true;
      call('apply', { id: l.id, name: n, start: l.start, end: l.end }, function () { toast('応募しました'); });
    };
    act.appendChild(bFull);

    var bPartial = el('button', 'sub', '一部時間のみ入る');
    bPartial.onclick = function () {
      if (openApply === l.id) { openApply = null; render(); return; }
      openApply = l.id; render();
    };
    act.appendChild(bPartial);
    c.appendChild(act);

    if (openApply === l.id) {
      var form = el('div', 'apply-form');
      var f1 = el('div', 'fld'); f1.appendChild(el('span', null, '開始'));
      var i1 = document.createElement('input'); i1.type = 'time'; i1.value = l.start; i1.min = l.start; i1.max = l.end;
      f1.appendChild(i1);
      var f2 = el('div', 'fld'); f2.appendChild(el('span', null, '終了'));
      var i2 = document.createElement('input'); i2.type = 'time'; i2.value = l.end; i2.min = l.start; i2.max = l.end;
      f2.appendChild(i2);
      form.appendChild(f1); form.appendChild(f2);
      var bGo = el('button', null, '確定');
      bGo.onclick = function () {
        var n = norm($('me').value);
        if (!n) { toast('先に名前を入力してください'); $('me').focus(); return; }
        if (!i1.value || !i2.value || i1.value >= i2.value) { toast('時間を正しく入力してください'); return; }
        bGo.disabled = true;
        call('apply', { id: l.id, name: n, start: i1.value, end: i2.value }, function () { openApply = null; toast('応募しました'); });
      };
      form.appendChild(bGo);
      c.appendChild(form);
    }
    return c;
  }

  $('enter').onclick = enter;
  $('pass').onkeydown = function (e) { if (e.key === 'Enter') enter(); };
  var EYE_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
  var EYE_OFF_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.77 21.77 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
  $('passEye').innerHTML = EYE_SVG;
  $('passEye').onclick = function () {
    var show = $('pass').type === 'password';
    $('pass').type = show ? 'text' : 'password';
    $('passEye').innerHTML = show ? EYE_OFF_SVG : EYE_SVG;
    $('passEye').setAttribute('aria-label', show ? 'パスワードを隠す' : 'パスワードを表示');
  };
  $('me').oninput = function () { store('sb_me', $('me').value); render(); };
  $('refreshBtn').onclick = function () { call('load'); };
  $('chips').addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    var cat = chip.dataset.cat || '';
    if (!cat) { CAT_SEL = {}; } else { CAT_SEL[cat] = !CAT_SEL[cat]; }
    var any = catSelActive_();
    Array.prototype.forEach.call($('chips').children, function (c) {
      var k = c.dataset.cat || '';
      c.classList.toggle('on', k ? !!CAT_SEL[k] : !any);
    });
    render();
  });
  $('timeChips').addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    var k = chip.dataset.band;
    TIME_SEL[k] = !TIME_SEL[k];
    chip.classList.toggle('on', !!TIME_SEL[k]);
    render();
  });
  $('me').value = store('sb_me') || '';
  var saved = store('sb_pass');
  if (saved) { $('pass').value = saved; }
  setInterval(function () { if (PASS && !document.hidden) call('load'); }, 60000);
</script>
</body>
</html>
